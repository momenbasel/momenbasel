name: activity-graph

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/activity-graph.mjs'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Render activity graph
        env:
          # GRAPH_TOKEN is optional; the default GITHUB_TOKEN reads public
          # contribution data fine.
          GITHUB_TOKEN: ${{ secrets.GRAPH_TOKEN || secrets.GITHUB_TOKEN }}
          GRAPH_USER: ${{ github.repository_owner }}
        run: node scripts/activity-graph.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity-graph.svg; then
            echo "no change"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-graph.svg
          git commit -m 'chore: refresh activity graph'
          git push
